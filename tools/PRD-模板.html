<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRD 模板 - DIAL-BAM Method</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem 0; }
    .meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .section h3 { font-size: 1rem; margin: 0 0 0.5rem 0; color: var(--accent); }
    .section .hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem; }
    .section textarea, .section input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 0.5rem;
      font-size: 0.9rem;
    }
    .section textarea { min-height: 80px; resize: vertical; }
    .section input { min-height: 2rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--surface2); color: var(--text-muted); font-weight: 500; }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .btn:hover { background: var(--surface2); border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.8rem; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>PRD 模板</h1>
  <p class="meta">产品需求文档 — 业务背景、功能清单、用户旅程、MVP 范围、非功能需求（Insight 阶段）</p>

  <div class="section">
    <h3>业务背景</h3>
    <textarea id="businessBg" placeholder="业务背景、项目目标、与 Project Brief 的衔接"></textarea>
  </div>

  <div class="section">
    <h3>目标用户</h3>
    <textarea id="targetUser" placeholder="目标用户画像、角色、使用场景"></textarea>
  </div>

  <div class="section">
    <h3>功能清单（与 L2 对应）</h3>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>L2 编号</th><th>功能模块</th><th>说明</th><th>MVP</th><th></th></tr></thead>
      <tbody id="funcBody"></tbody>
    </table>
    </div>
    <button class="btn btn-sm" onclick="addFunc()">+ 新增功能</button>
    <div class="hint">可从 BAM 追溯矩阵导入 L2</div>
  </div>

  <div class="section">
    <h3>用户旅程、角色</h3>
    <textarea id="userJourney" placeholder="用户旅程、角色权限、关键路径"></textarea>
  </div>

  <div class="section">
    <h3>MVP 范围与验收标准</h3>
    <textarea id="mvpScope" placeholder="MVP 包含的功能、验收标准、上线条件"></textarea>
  </div>

  <div class="section">
    <h3>非功能需求</h3>
    <textarea id="nfr" placeholder="性能、安全、可用性、兼容性等"></textarea>
  </div>

  <div class="actions">
    <a href="index.html" class="btn">← 工具中心</a>
    <input type="file" id="fileImport" accept=".json" style="display:none">
    <button class="btn" onclick="downloadTemplate()">下载模板</button>
    <button class="btn" onclick="document.getElementById('fileImport').click()">导入 JSON</button>
    <button class="btn" onclick="exportJSON()">导出 JSON</button>
    <button class="btn" onclick="exportMD()">导出 Markdown</button>
    <button class="btn" onclick="fromBAM()">从 BAM 导入 L2</button>
    <a href="Project-Brief.html" class="btn">← Project Brief</a>
    <a href="BAM-追溯矩阵.html" class="btn">→ BAM 追溯矩阵</a>
    <button class="btn" onclick="clearAll()">清空</button>
  </div>

  <script>
    const STORAGE_KEY = 'dial-bam-prd';
    const FIELDS = ['businessBg','targetUser','userJourney','mvpScope','nfr'];

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        FIELDS.forEach(k => { const el = document.getElementById(k); if (el && d[k]) el.value = d[k]; });
        if (d.functions && Array.isArray(d.functions)) data.functions = d.functions;
      } catch (_) {}
    }
    function save() {
      const d = {};
      FIELDS.forEach(k => { const el = document.getElementById(k); if (el) d[k] = el.value; });
      d.functions = data.functions;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    }
    document.querySelectorAll('.section textarea').forEach(el => {
      if (el.id && FIELDS.includes(el.id)) el.addEventListener('input', save);
    });

    async function downloadTemplate() {
      try {
        const r = await fetch('templates/PRD-模板.json');
        const t = r.ok ? await r.json() : { meta:{name:'PRD',updated:''}, businessBg:'',targetUser:'',userJourney:'',mvpScope:'',nfr:'',functions:[] };
        delete t._comment;
        const blob = new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'PRD-模板.json';
        a.click();
      } catch (_) {
        const t = { meta:{name:'PRD',updated:''}, businessBg:'',targetUser:'',userJourney:'',mvpScope:'',nfr:'',functions:[] };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' }));
        a.download = 'PRD-模板.json';
        a.click();
      }
    }
    document.getElementById('fileImport').addEventListener('change', function(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          FIELDS.forEach(k => { const el = document.getElementById(k); if (el && d[k] !== undefined) el.value = d[k]; });
          if (Array.isArray(d.functions)) data.functions = d.functions;
          save();
          renderFuncs();
          alert('导入成功');
        } catch (err) { alert('导入失败：' + (err.message || '无效 JSON')); }
        e.target.value = '';
      };
      r.readAsText(f, 'UTF-8');
    });

    let data = { functions: [] };

    function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

    function renderFuncs() {
      const tbody = document.getElementById('funcBody');
      tbody.innerHTML = '';
      (data.functions || []).forEach((f, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" value="${escapeHtml(f.id||'')}" placeholder="L2-01-01" onchange="updateFunc(${i},'id',this.value)" style="min-width:80px"></td>
          <td><input type="text" value="${escapeHtml(f.name||'')}" placeholder="功能名称" onchange="updateFunc(${i},'name',this.value)"></td>
          <td><input type="text" value="${escapeHtml(f.desc||'')}" placeholder="说明" onchange="updateFunc(${i},'desc',this.value)"></td>
          <td><select onchange="updateFunc(${i},'mvp',this.value)">
            <option value="yes" ${f.mvp==='yes'?'selected':''}>是</option>
            <option value="no" ${f.mvp==='no'?'selected':''}>否</option>
          </select></td>
          <td><button class="btn btn-sm" onclick="delFunc(${i})">删除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }
    function updateFunc(i, k, v) { data.functions[i] = data.functions[i] || {}; data.functions[i][k] = v; save(); }
    function addFunc() {
      data.functions = data.functions || [];
      data.functions.push({ id: '', name: '', desc: '', mvp: 'yes' });
      save();
      renderFuncs();
    }
    function delFunc(i) { data.functions.splice(i, 1); save(); renderFuncs(); }

    function fromBAM() {
      try {
        const raw = localStorage.getItem('dial-bam-matrix');
        if (!raw) { alert('BAM 追溯矩阵无数据，请先填写或导入。'); return; }
        const m = JSON.parse(raw);
        const list = [];
        if (m.L2 && Array.isArray(m.L2)) {
          m.L2.forEach(x => list.push({
            id: x.id || x.code || '',
            name: x.name || x.title || '',
            desc: x.desc || x.route || '',
            mvp: 'yes'
          }));
        }
        if (list.length > 0) {
          data.functions = list;
          save();
          renderFuncs();
          alert('已从 BAM 导入 ' + list.length + ' 个 L2 功能。');
        } else { alert('BAM 中无 L2 数据。'); }
      } catch (e) { alert('读取 BAM 失败：' + (e.message || '无效数据')); }
    }

    function exportJSON() {
      const d = { meta: { name: 'PRD', updated: new Date().toISOString().slice(0,10) } };
      FIELDS.forEach(k => { const el = document.getElementById(k); if (el) d[k] = el.value; });
      d.functions = data.functions;
      const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'PRD-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
    }

    function exportMD() {
      let md = '# PRD 产品需求文档\n\n';
      const labels = { businessBg:'业务背景', targetUser:'目标用户', userJourney:'用户旅程与角色', mvpScope:'MVP 范围与验收标准', nfr:'非功能需求' };
      FIELDS.forEach(k => {
        const el = document.getElementById(k);
        const v = el ? el.value : '';
        if (v) md += '## ' + labels[k] + '\n\n' + v + '\n\n';
      });
      if (data.functions && data.functions.length > 0) {
        md += '## 功能清单\n\n| L2 编号 | 功能模块 | 说明 | MVP |\n|---------|----------|------|-----|\n';
        data.functions.forEach(f => md += `| ${f.id||'-'} | ${f.name||'-'} | ${f.desc||'-'} | ${f.mvp==='yes'?'是':'否'} |\n`);
      }
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'PRD-' + new Date().toISOString().slice(0,10) + '.md';
      a.click();
    }

    function clearAll() {
      if (confirm('确定清空？')) {
        FIELDS.forEach(k => { const el = document.getElementById(k); if (el) el.value = ''; });
        data.functions = [];
        localStorage.removeItem(STORAGE_KEY);
        renderFuncs();
      }
    }

    load();
    renderFuncs();
  </script>
</body>
</html>
