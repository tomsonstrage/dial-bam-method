<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商业模式画布 - DIAL-BAM Method</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --success: #3fb950;
      --border: #30363d;
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 1.5rem;
      line-height: 1.5;
    }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem 0; }
    .meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; }
    .bmc-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      grid-template-rows: auto auto auto auto;
      gap: 0.5rem;
      max-width: 1100px;
      margin-bottom: 1.5rem;
    }
    .bmc-left-1 { grid-area: 1/1/2/2; }
    .bmc-center { grid-area: 1/2/4/3; }
    .bmc-right-1 { grid-area: 1/3/2/4; }
    .bmc-left-2 { grid-area: 2/1/3/2; }
    .bmc-right-2 { grid-area: 2/3/3/4; }
    .bmc-left-3 { grid-area: 3/1/4/2; }
    .bmc-right-3 { grid-area: 3/3/4/4; }
    .bmc-bottom-1 { grid-area: 4/1/5/2; }
    .bmc-bottom-2 { grid-area: 4/2/5/4; }
    .bmc-cell {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      min-height: 100px;
    }
    .bmc-cell h3 {
      font-size: 0.85rem;
      margin: 0 0 0.5rem 0;
      color: var(--accent);
      font-weight: 600;
    }
    .bmc-cell textarea {
      width: 100%;
      min-height: 70px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 0.5rem;
      font-size: 0.85rem;
      resize: vertical;
    }
    .bmc-cell textarea::placeholder { color: var(--text-muted); }
    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .btn:hover { background: var(--surface2); border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #4c9aed; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 900px) {
      body { padding: 1rem; }
      .bmc-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
      .bmc-left-1,.bmc-center,.bmc-right-1,.bmc-left-2,.bmc-right-2,.bmc-left-3,.bmc-right-3,.bmc-bottom-1,.bmc-bottom-2 { grid-area: auto; }
    }
  </style>
</head>
<body>
  <h1>商业模式画布</h1>
  <p class="meta">客户细分、价值主张、渠道、客户关系、收入、资源、活动、合作、成本 — Insight 阶段战略产出</p>

  <div class="bmc-grid">
    <div class="bmc-cell bmc-left-1">
      <h3>关键合作 Key Partnerships</h3>
      <textarea id="partners" placeholder="谁是你的关键合作伙伴？供应商？"></textarea>
    </div>
    <div class="bmc-cell bmc-center">
      <h3>价值主张 Value Propositions</h3>
      <textarea id="value" placeholder="为谁解决什么问题？独特价值是什么？"></textarea>
    </div>
    <div class="bmc-cell bmc-right-1">
      <h3>客户关系 Customer Relationships</h3>
      <textarea id="relationships" placeholder="如何与客户建立和维护关系？"></textarea>
    </div>
    <div class="bmc-cell bmc-left-2">
      <h3>关键活动 Key Activities</h3>
      <textarea id="activities" placeholder="要完成价值主张，需做哪些关键活动？"></textarea>
    </div>
    <div class="bmc-cell bmc-right-2">
      <h3>渠道通路 Channels</h3>
      <textarea id="channels" placeholder="如何触达客户？传递价值？"></textarea>
    </div>
    <div class="bmc-cell bmc-left-3">
      <h3>核心资源 Key Resources</h3>
      <textarea id="resources" placeholder="需要哪些核心资源？人、技术、品牌？"></textarea>
    </div>
    <div class="bmc-cell bmc-right-3">
      <h3>客户细分 Customer Segments</h3>
      <textarea id="segments" placeholder="目标客户是谁？细分市场？"></textarea>
    </div>
    <div class="bmc-cell bmc-bottom-1">
      <h3>成本结构 Cost Structure</h3>
      <textarea id="costs" placeholder="最重要的成本是什么？固定/可变？"></textarea>
    </div>
    <div class="bmc-cell bmc-bottom-2">
      <h3>收入来源 Revenue Streams</h3>
      <textarea id="revenue" placeholder="客户愿意为什么付费？收入模式？"></textarea>
    </div>
  </div>

  <div class="actions">
    <a href="index.html" class="btn">← 工具中心</a>
    <input type="file" id="fileImport" accept=".json" style="display:none">
    <button class="btn" onclick="downloadTemplate()">下载模板</button>
    <button class="btn" onclick="document.getElementById('fileImport').click()">导入 JSON</button>
    <button class="btn" onclick="exportJSON()">导出 JSON</button>
    <button class="btn" onclick="exportText()">导出文本</button>
    <button class="btn primary" onclick="copyForAI()">复制为 AI 提示词</button>
    <a href="洞察可视化.html" class="btn">← 洞察可视化</a>
    <a href="BAM-追溯矩阵.html" class="btn">→ BAM 追溯矩阵</a>
    <button class="btn" onclick="clearAll()">清空</button>
  </div>

  <script>
    const STORAGE_KEY = 'dial-bam-bmc';
    const KEYS = ['partners','activities','resources','value','relationships','channels','segments','costs','revenue'];

    function load() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        KEYS.forEach(k => { const el = document.getElementById(k); if (el && d[k]) el.value = d[k]; });
      } catch (_) {}
    }
    function save() {
      const d = {};
      KEYS.forEach(k => { const el = document.getElementById(k); if (el) d[k] = el.value; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    }
    document.querySelectorAll('.bmc-cell textarea').forEach(el => el.addEventListener('input', save));

    async function downloadTemplate() {
      try {
        const r = await fetch('templates/商业模式画布-模板.json');
        let t = r.ok ? await r.json() : {};
        delete t._comment;
        const blob = new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = '商业模式画布-模板.json';
        a.click();
      } catch (_) {
        const t = {};
        KEYS.forEach(k => t[k] = '');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(t, null, 2)], { type: 'application/json' }));
        a.download = '商业模式画布-模板.json';
        a.click();
      }
    }
    document.getElementById('fileImport').addEventListener('change', function(e) {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          KEYS.forEach(k => { const el = document.getElementById(k); if (el && d[k] !== undefined) el.value = d[k]; });
          save();
          alert('导入成功');
        } catch (err) { alert('导入失败：' + (err.message || '无效 JSON')); }
        e.target.value = '';
      };
      r.readAsText(f, 'UTF-8');
    });

    function exportJSON() {
      const d = { meta: { name: '商业模式画布', updated: new Date().toISOString().slice(0,10) } };
      KEYS.forEach(k => { const el = document.getElementById(k); if (el) d[k] = el.value; });
      const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '商业模式画布-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
    }
    function exportText() {
      const labels = { partners:'关键合作',activities:'关键活动',resources:'核心资源',value:'价值主张',relationships:'客户关系',channels:'渠道通路',segments:'客户细分',costs:'成本结构',revenue:'收入来源' };
      let text = '商业模式画布\n' + '='.repeat(20) + '\n\n';
      KEYS.forEach(k => {
        const el = document.getElementById(k);
        text += labels[k] + '：\n' + (el ? el.value : '') + '\n\n';
      });
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '商业模式画布-' + new Date().toISOString().slice(0,10) + '.txt';
      a.click();
    }
    function copyForAI() {
      const labels = { partners:'关键合作',activities:'关键活动',resources:'核心资源',value:'价值主张',relationships:'客户关系',channels:'渠道通路',segments:'客户细分',costs:'成本结构',revenue:'收入来源' };
      let s = '请基于以下商业模式画布，输出：1) 战略方向与差异化建议；2) 与 L2 业务模块的映射建议；3) 风险与应对。\n\n【商业模式画布】\n';
      KEYS.forEach(k => {
        const el = document.getElementById(k);
        s += labels[k] + '：' + (el ? el.value || '（待填写）' : '') + '\n';
      });
      navigator.clipboard.writeText(s).then(() => alert('已复制到剪贴板'));
    }
    function clearAll() {
      if (confirm('确定清空？')) {
        KEYS.forEach(k => { const el = document.getElementById(k); if (el) el.value = ''; });
        localStorage.removeItem(STORAGE_KEY);
      }
    }
    load();
  </script>
</body>
</html>
